name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install retalk (optional — enables the relay round-trip test)
      run: pip install retalk || echo "retalk not installable here; round-trip test will skip"

    - name: Run tests
      run: python -m unittest discover -s tests -v
